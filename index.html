<!-- Masukkan CDN Supabase ini di dalam tag <head> bersama script lainnya -->
<script src="https://jsdelivr.net"></script>

<script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
        setup() {
            // --- 1. KONFIGURASI SUPABASE ---
            // Ganti URL dan KEY ini dengan milik proyek Supabase Anda
            const SUPABASE_URL = "https://wzmjdlxnjoyzzvzpmhqj.supabase.co/rest/v1/"; 
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6bWpkbHhuam95enp2enBtaHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTU2NjgsImV4cCI6MjEwNTU5MTY2OH0.i8LtB72RGso_--VhWNQVpjFr44dHK_pYpRqsuMkCQ4c";
            const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            // --- 2. STATE VARIABEL ---
            const activeTab = ref('dashboard');
            const assets = ref([]);
            const mutations = ref([]);
            const roomList = ref(['Ruang Lab A', 'Ruang Lab B', 'Gudang Utama']); // Sesuaikan dengan kebutuhan
            
            // Variabel Form / Modalnya
            const activeModal = ref(null);
            const selectedAsset = ref({});
            // Tambahkan variabel form input asset/mutation Anda di sini...

            // --- 3. FUNGSI CRUD SUPABASE ---

            // A. Ambil Data (Read) saat aplikasi pertama kali dimuat
            const fetchAllData = async () => {
                try {
                    // Ambil Data Aset
                    const { data: assetData, error: assetErr } = await supabase
                        .from('assets')
                        .select('*')
                        .order('created_at', { ascending: false });
                    if (assetErr) throw assetErr;
                    assets.value = assetData || [];

                    // Ambil Data Mutasi
                    const { data: mutationData, error: mutErr } = await supabase
                        .from('mutations')
                        .select('*')
                        .order('date', { ascending: false });
                    if (mutErr) throw mutErr;
                    mutations.value = mutationData || [];
                } catch (error) {
                    alert("Gagal mengambil data dari database: " + error.message);
                }
            };

            // B. Tambah Aset Baru (Create)
            const handleAddAsset = async (newAssetData) => {
                try {
                    const { data, error } = await supabase
                        .from('assets')
                        .insert([newAssetData])
                        .select();
                    
                    if (error) throw error;
                    
                    // Update state lokal Vue
                    assets.value.unshift(data[0]);
                    closeModal();
                    alert("Aset berhasil ditambahkan ke Supabase!");
                } catch (error) {
                    alert("Gagal menambah aset: " + error.message);
                }
            };

            // C. Edit / Update Data Aset (Update)
            const handleUpdateAsset = async (id, updatedData) => {
                try {
                    const { error } = await supabase
                        .from('assets')
                        .update(updatedData)
                        .eq('id', id);
                    
                    if (error) throw error;

                    // Update state lokal Vue
                    const index = assets.value.findIndex(a => a.id === id);
                    if (index !== -1) {
                        assets.value[index] = { ...assets.value[index], ...updatedData };
                    }
                    closeModal();
                    alert("Data aset berhasil diperbarui!");
                } catch (error) {
                    alert("Gagal memperbarui data: " + error.message);
                }
            };

            // D. Proses Mutasi Barang (Double Action: Insert Log & Update Ruangan)
            const handleProcessMutation = async (mutationForm) => {
                try {
                    // 1. Simpan ke tabel riwayat mutasi
                    const { error: mutError } = await supabase
                        .from('mutations')
                        .insert([{
                            assetName: mutationForm.assetName,
                            fromRoom: mutationForm.fromRoom,
                            toRoom: mutationForm.toRoom,
                            pic: mutationForm.pic,
                            notes: mutationForm.notes,
                            date: mutationForm.date
                        }]);
                    if (mutError) throw mutError;

                    // 2. Update Lokasi Ruangan Terkini di tabel assets berdasarkan kodenya
                    const { error: assetError } = await supabase
                        .from('assets')
                        .update({ room: mutationForm.toRoom })
                        .eq('code', mutationForm.assetCode);
                    if (assetError) throw assetError;

                    // Refresh data lokal dari database agar tersinkronisasi sempurna
                    await fetchAllData();
                    alert("Proses mutasi berhasil dicatat dan diperbarui!");
                } catch (error) {
                    alert("Gagal memproses mutasi: " + error.message);
                }
            };

            // E. Hapus Aset (Optional Delete)
            const handleDeleteAsset = async (id) => {
                if (confirm("Apakah Anda yakin ingin menghapus aset ini secara permanen dari database?")) {
                    try {
                        const { error } = await supabase.from('assets').delete().eq('id', id);
                        if (error) throw error;
                        assets.value = assets.value.filter(a => a.id !== id);
                    } catch (error) {
                        alert("Gagal menghapus aset: " + error.message);
                    }
                }
            };

            // --- 4. LIFECYCLE HOOK ---
            onMounted(() => {
                fetchAllData(); // Jalankan sinkronisasi database saat web dibuka
            });

            // Return semua fungsi dan properti agar bisa dibaca oleh template HTML HTML Anda
            return {
                activeTab, assets, mutations, roomList, activeModal, selectedAsset,
                fetchAllData, handleAddAsset, handleUpdateAsset, handleProcessMutation, handleDeleteAsset
                // ... return computed properties Anda seperti dueCalibrationCount, totalAssetValue dll.
            }
        }
    }).mount('#app');
</script>
